name: Pack (test build)

# Builds unsigned installers to prove packaging still works. Nothing is published.
# Run it by hand, or it runs automatically when packaging-related files change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - build/**
      - vite.config.ts
      - electron/**
      - .github/workflows/pack.yml

permissions:
  contents: read

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: pack:mac
          - os: windows-latest
            script: pack:win
          - os: ubuntu-latest
            script: pack:linux
          - os: ubuntu-24.04-arm
            script: pack:linux:arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: barepane-${{ matrix.os }}-${{ matrix.script }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.yml
          retention-days: 7
